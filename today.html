<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090e"><title>ON AIR — Dos + Pecs modéré + Core</title><style>:root{--bg:#09090e;--panel:#111118;--line:#252530;--text:#eeeef4;--muted:#8a8a97;--blue:#38bdf8;--orange:#f97316;--purple:#a855f7;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:16px 13px 100px}.app{max-width:560px;margin:auto}.hero{text-align:center;margin-bottom:14px}.hero small{font-size:10px;letter-spacing:.24em;color:#656573}.hero h1{margin:5px 0 3px;font-size:28px;background:linear-gradient(120deg,var(--blue),var(--purple));-webkit-background-clip:text;color:transparent}.hero p{margin:0;color:#8b8b96;font-size:11px}.progress{display:flex;gap:8px;align-items:center;margin-top:12px}.bar{height:6px;background:#1c1c24;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}.stat{font-size:11px;color:#81818c}.warm,.block,.summary{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:10px}.warm{padding:12px 14px}.warm b{color:#fbbf24;font-size:12px}.warm li{font-size:11px;color:#aaaab5;line-height:1.45}.block{overflow:hidden}.head{padding:12px 13px;display:flex;align-items:center;gap:9px}.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);font-weight:900}.head strong{font-size:13px}.head small{display:block;color:#686875;font-size:10px;margin-top:2px}.content{padding:0 9px 9px}.ex{background:#0d0d14;border:1px solid #1f1f29;border-radius:12px;padding:10px;margin:7px 0}.ex h3{font-size:13px;margin:0 0 5px}.meta{font-size:10px;color:#9c9ca8;margin-bottom:8px}.sets{display:grid;gap:6px}.set{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:6px;align-items:center}.set span{font-size:10px;color:#777}.set input[type=number],.set input[type=text]{width:100%;background:#15151d;border:1px solid #2a2a34;border-radius:8px;color:#fff;padding:8px;font-size:12px}.set input[type=checkbox]{width:24px;height:24px;accent-color:var(--c)}.tip{font-size:10px;line-height:1.4;color:#777783;font-style:italic;margin-top:7px}.rest{margin-top:8px;border:1px solid color-mix(in srgb,var(--c) 50%,#333);background:none;color:var(--c);border-radius:8px;padding:6px 9px;font-weight:800}.summary{padding:12px}.summary textarea{width:100%;min-height:190px;background:#0a0a10;border:1px solid #252530;border-radius:9px;color:#ddd;padding:10px;font-size:11px;line-height:1.5}.summary button{width:100%;margin-top:8px;border:0;border-radius:9px;background:#38bdf8;color:#061018;padding:10px;font-weight:900}.timer{position:fixed;left:0;right:0;bottom:0;background:#111117f2;border-top:1px solid #24242d;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.timerin{max-width:560px;margin:auto;display:flex;align-items:center;gap:7px}.clock{font-size:22px;font-weight:900;min-width:62px}.timer button{border:0;background:#22222b;color:#ddd;border-radius:8px;padding:8px 10px;font-weight:800;font-size:11px}.reset{margin-left:auto;color:#fb7185!important}</style></head><body><div class="app"><header class="hero"><small>ON AIR · 10/09/2026</small><h1>DOS + PECS MODÉRÉ + CORE</h1><p>Priorité dos · jambes au repos · RIR 2–3</p><div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><span class="stat" id="stat">0/27 séries</span></div></header><section class="warm"><b>⚡ ÉCHAUFFEMENT · 8 MIN</b><ul><li>Rameur 4 min tranquille</li><li>Rotations externes élastique 2×15</li><li>Face pull léger 2×15</li><li>1–2 séries de chauffe sur le premier tirage</li></ul></section><div id="blocks"></div><section class="summary"><strong>RÉSUMÉ STRAVA</strong><textarea id="summary" readonly></textarea><button id="copy">Copier le résumé</button></section></div><div class="timer"><div class="timerin"><div class="clock" id="clock">0:00</div><button data-t="45">45s</button><button data-t="75">75s</button><button data-t="120">2m</button><button class="reset" id="reset">Reset</button></div></div><script>const W=[{c:'#38bdf8',n:'A',t:'DOS — FORCE',x:[['Tractions pronation/neutres',4,'6–8','PDC','2 min','RIR 2 · descente 2–3 sec, amplitude complète'],['Rowing haltère unilatéral',4,'10','28→30 kg','75–90s','28 kg puis 30 kg si propre, sans rotation du buste'],['Tirage vertical prise neutre',3,'10–12','RIR 2','75s','Coudes vers les poches, poitrine haute']]},{c:'#38bdf8',n:'B',t:'DOS — ÉPAISSEUR + ARRIÈRE ÉPAULE',x:[['Rowing assis poulie basse',3,'12','RIR 2–3','70s','Pause 1 sec en fin de tirage'],['Oiseau machine / reverse pec deck',3,'15','modéré','55s','À finir aujourd’hui : tempo 2-1-3'],['Face pull',2,'20','30 kg','45s','Seulement 2 séries, qualité stricte']]},{c:'#f97316',n:'C',t:'PECS — RAPPEL',x:[['Chest press',3,'10–12','30→35 kg','80s','Commence à 30 kg, monte à 35 kg uniquement si tout est nickel'],['Dips',2,'8–10','PDC','90s','Uniquement si 100 % indolore, pas besoin de battre 2×11']]},{c:'#22c55e',n:'D',t:'CORE + GRIP',x:[['Relevés de jambes suspendu',3,'15–20','PDC','30s','Cible 20 si propre et épaule confortable'],['Planche lestée',2,'60 sec','+10 kg','30s','Bassin neutre, respiration contrôlée'],['Farmer walk (optionnel)',2,'45–60 sec','30–32 kg/main','60s','Grip + trapèzes + gainage, seulement si énergie']] }];const KEY='onair_1009';let state=JSON.parse(localStorage.getItem(KEY)||'{}'),timer=null;const root=document.getElementById('blocks');let idx=0;W.forEach(b=>{let s=document.createElement('section');s.className='block';s.style.setProperty('--c',b.c);s.innerHTML=`<div class="head"><div class="badge">${b.n}</div><div><strong>${b.t}</strong><small>${b.x.length} exercices</small></div></div><div class="content"></div>`;let c=s.querySelector('.content');b.x.forEach(e=>{let a=document.createElement('article');a.className='ex';a.innerHTML=`<h3>${e[0]}</h3><div class="meta">${e[1]} séries · ${e[2]} · ${e[3]} · repos ${e[4]}</div><div class="sets"></div><div class="tip">${e[5]}</div><button class="rest" data-rest="${parseInt(e[4])||60}">Lancer repos</button>`;let sets=a.querySelector('.sets');for(let j=1;j<=e[1];j++){let id='s'+idx+'_'+j,done=!!state[id],kg=state[id+'k']||e[3],reps=state[id+'r']||e[2];sets.insertAdjacentHTML('beforeend',`<div class="set"><span>S${j}</span><input type="text" data-k="${id+'k'}" value="${kg}"><input type="text" data-r="${id+'r'}" value="${reps}"><input type="checkbox" data-id="${id}" ${done?'checked':''}></div>`)}c.appendChild(a);idx++});root.appendChild(s)});function save(){localStorage.setItem(KEY,JSON.stringify(state))}function update(){let all=[...document.querySelectorAll('input[type=checkbox]')],d=all.filter(x=>x.checked);document.getElementById('stat').textContent=d.length+'/'+all.length+' séries';document.getElementById('fill').style.width=(d.length/all.length*100)+'%';let doneEx=[];document.querySelectorAll('.ex').forEach(e=>{let cs=[...e.querySelectorAll('input[type=checkbox]')];if(cs.some(x=>x.checked)){let detail=cs.map((x,i)=>x.checked?`S${i+1} ${e.querySelectorAll('[data-k]')[i].value} × ${e.querySelectorAll('[data-r]')[i].value}`:null).filter(Boolean).join(' · ');doneEx.push('▸ '+e.querySelector('h3').textContent+' — '+detail)}});document.getElementById('summary').value='💪 DOS + PECS MODÉRÉ + CORE — ON AIR | 10/09/2026\n'+d.length+'/'+all.length+' séries validées\n\n'+doneEx.join('\n')+'\n\n✅ Priorité dos · jambes au repos · travail propre RIR 2–3'}document.addEventListener('change',e=>{if(e.target.dataset.id){state[e.target.dataset.id]=e.target.checked;save();update()}if(e.target.dataset.k||e.target.dataset.r){state[e.target.dataset.k||e.target.dataset.r]=e.target.value;save();update()}});function start(n){clearInterval(timer);let r=n,cl=document.getElementById('clock');let draw=()=>cl.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');draw();timer=setInterval(()=>{r--;draw();if(r<=0){clearInterval(timer);navigator.vibrate&&navigator.vibrate([150,80,150])}},1000)}document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>start(+b.dataset.rest));document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>start(+b.dataset.t));document.getElementById('copy').onclick=async()=>{let t=document.getElementById('summary').value,b=document.getElementById('copy');try{await navigator.clipboard.writeText(t);b.textContent='Copié ✓';setTimeout(()=>b.textContent='Copier le résumé',1200)}catch(e){document.getElementById('summary').select()}};document.getElementById('reset').onclick=()=>{if(confirm('Réinitialiser la séance ?')){localStorage.removeItem(KEY);location.reload()}};update();</script></body></html>
